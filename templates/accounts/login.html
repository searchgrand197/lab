{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Khalsa Clinical Laboratory</title>
  <link rel="stylesheet" href="{% static 'lab/css/app.css' %}">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="mark">K</div>
      <h1>Khalsa Clinical Laboratory</h1>
      <p class="tagline">Sign in to manage patients, tests, and reports.</p>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="field">
          <label for="username">Username</label>
          <input class="field-input" type="text" id="username" name="username" autofocus required placeholder="admin">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="field-input" type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button class="btn btn-primary" type="submit">Enter lab workspace</button>
      </form>
    </div>
  </div>
</body>
</html>
